# Copy this file to config/taskflow.yml for local runtime tuning.
# Environment variables override values in this file.
# TASKFLOW_MAX_INPUT_BYTES controls per-file client payload size for plugin inputs.
# Orphan-output GC is coordinator-owned and currently configured through
# TASKFLOW_ORPHAN_OUTPUT_GC_ENABLED,
# TASKFLOW_ORPHAN_OUTPUT_GC_SAFETY_WINDOW_MS,
# TASKFLOW_ORPHAN_OUTPUT_GC_INTERVAL_MS, and
# TASKFLOW_ORPHAN_OUTPUT_GC_BATCH_SIZE
# (defaults: true, 86400000, 300000, and 100).
# The coordinator operational listener serves /metrics, /health/live, and
# /health/ready. TASKFLOW_METRICS_ENABLED, TASKFLOW_METRICS_HOST, and
# TASKFLOW_METRICS_PORT configure it (defaults: true, 127.0.0.1, and 9464).

scheduler:
  taskTimeoutMs: 60000
  taskLeaseMs: 120000
  maxTaskRetries: 20
  inboundQueueCapacity: 1000
  maxActiveJobs: 1000
  maxActiveTasks: 100000
  maxPendingOutboxRows: 100000
  jobResultMaxDeliveryAttempts: 300
  schedulerMessageBatchSize: 100
  schedulerDeadlineBatchSize: 100
  schedulerDispatchBatchSize: 100
  schedulerMaxAssignmentsPerJobPerRound: 1
  schedulerOutboxBatchSize: 100
  metricsLogIntervalMs: 10000
  scoring:
    loadWeight: 6.0
    latencyWeight: 2.0
    durationWeight: 1.5
    failureWeight: 4.0
    latencyBaselineMs: 200.0
    durationBaselineMs: 5000.0
    ewmaAlpha: 0.2
