services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: taskflow-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_port_listener 5672",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: ["object-store"]
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER
      - MINIO_ROOT_PASSWORD
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        : "$${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}"
        : "$${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}"
        exec minio server /data --console-address ":9001"
    volumes:
      - taskflow-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  minio-init:
    image: minio/mc:RELEASE.2025-05-21T01-59-54Z
    profiles: ["object-store"]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      - MINIO_ROOT_USER
      - MINIO_ROOT_PASSWORD
      - TASKFLOW_MINIO_BUCKET=${TASKFLOW_MINIO_BUCKET:-taskflow}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        : "$${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}"
        : "$${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}"
        mc alias set taskflow http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "taskflow/$${TASKFLOW_MINIO_BUCKET}"
        mc stat "taskflow/$${TASKFLOW_MINIO_BUCKET}"

  coordinator:
    build:
      context: .
    image: taskflow-demo:local
    ports:
      - "${TASKFLOW_METRICS_PORT:-9464}:${TASKFLOW_METRICS_PORT:-9464}"
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      TASKFLOW_METRICS_ENABLED: ${TASKFLOW_METRICS_ENABLED:-true}
      TASKFLOW_METRICS_HOST: ${TASKFLOW_METRICS_HOST:-0.0.0.0}
      TASKFLOW_METRICS_PORT: ${TASKFLOW_METRICS_PORT:-9464}
      TASKFLOW_MINIO_ENDPOINT: http://minio:9000
      TASKFLOW_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-}
      TASKFLOW_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-}
      TASKFLOW_MINIO_BUCKET: ${TASKFLOW_MINIO_BUCKET:-taskflow}
      TASKFLOW_ORPHAN_OUTPUT_GC_ENABLED: ${TASKFLOW_ORPHAN_OUTPUT_GC_ENABLED:-true}
      TASKFLOW_ORPHAN_OUTPUT_GC_SAFETY_WINDOW_MS: ${TASKFLOW_ORPHAN_OUTPUT_GC_SAFETY_WINDOW_MS:-86400000}
      TASKFLOW_ORPHAN_OUTPUT_GC_INTERVAL_MS: ${TASKFLOW_ORPHAN_OUTPUT_GC_INTERVAL_MS:-300000}
      TASKFLOW_ORPHAN_OUTPUT_GC_BATCH_SIZE: ${TASKFLOW_ORPHAN_OUTPUT_GC_BATCH_SIZE:-100}
    command:
      - java
      - -Xmx256m
      - -jar
      - taskflow-coordinator/target/taskflow-coordinator-1.0-SNAPSHOT-coordinator-runtime.jar

  peer-a:
    image: taskflow-demo:local
    pull_policy: never
    depends_on:
      rabbitmq:
        condition: service_healthy
      coordinator:
        condition: service_started
    environment:
      TASKFLOW_PEER_ID: compose-peer-a
      TASKFLOW_MINIO_ENDPOINT: http://minio:9000
      TASKFLOW_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-}
      TASKFLOW_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-}
      TASKFLOW_MINIO_BUCKET: ${TASKFLOW_MINIO_BUCKET:-taskflow}
    command:
      - java
      - -Xmx256m
      - -jar
      - taskflow-peer/target/taskflow-peer-1.0-SNAPSHOT-combined-runtime.jar

  peer-b:
    image: taskflow-demo:local
    pull_policy: never
    depends_on:
      rabbitmq:
        condition: service_healthy
      coordinator:
        condition: service_started
    environment:
      TASKFLOW_PEER_ID: compose-peer-b
      TASKFLOW_MINIO_ENDPOINT: http://minio:9000
      TASKFLOW_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-}
      TASKFLOW_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-}
      TASKFLOW_MINIO_BUCKET: ${TASKFLOW_MINIO_BUCKET:-taskflow}
    command:
      - java
      - -Xmx256m
      - -jar
      - taskflow-peer/target/taskflow-peer-1.0-SNAPSHOT-combined-runtime.jar

  peer-c:
    image: taskflow-demo:local
    pull_policy: never
    profiles: ["full-demo"]
    depends_on:
      rabbitmq:
        condition: service_healthy
      coordinator:
        condition: service_started
    environment:
      TASKFLOW_PEER_ID: compose-peer-c
      TASKFLOW_MINIO_ENDPOINT: http://minio:9000
      TASKFLOW_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-}
      TASKFLOW_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-}
      TASKFLOW_MINIO_BUCKET: ${TASKFLOW_MINIO_BUCKET:-taskflow}
    command:
      - java
      - -Xmx256m
      - -jar
      - taskflow-peer/target/taskflow-peer-1.0-SNAPSHOT-combined-runtime.jar

  submitter:
    image: taskflow-demo:local
    pull_policy: never
    depends_on:
      rabbitmq:
        condition: service_healthy
      coordinator:
        condition: service_started
      peer-a:
        condition: service_started
      peer-b:
        condition: service_started
    environment:
      TASKFLOW_PEER_ID: compose-submit
      TASKFLOW_DEMO_FILE_COUNT: 12
      TASKFLOW_MINIO_ENDPOINT: http://minio:9000
      TASKFLOW_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-}
      TASKFLOW_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-}
      TASKFLOW_MINIO_BUCKET: ${TASKFLOW_MINIO_BUCKET:-taskflow}
    volumes:
      - ./target/demo-results:/app/target/demo-results
      - ./target/rabbitmq-results:/app/target/rabbitmq-results
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        mkdir -p target/demo-input target/demo-results target/rabbitmq-results
        PNG='iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+/p9sAAAAASUVORK5CYII='
        count="$${TASKFLOW_DEMO_FILE_COUNT:-12}"
        inputs=""
        i=1
        while [ "$$i" -le "$$count" ]; do
          printf '%s' "$$PNG" | base64 -d > "target/demo-input/sample-$$i.png"
          inputs="$$inputs target/demo-input/sample-$$i.png"
          i=$$((i + 1))
        done
        echo "Generated $$count demo input files."
        echo "Waiting for coordinator and peers to register..."
        sleep 20
        java -Xmx256m -jar taskflow-peer/target/taskflow-peer-1.0-SNAPSHOT-combined-runtime.jar submit image png $$inputs
        latest="$$(find target/rabbitmq-results -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1)"
        if [ -z "$$latest" ]; then
          echo "No result directory was created."
          exit 1
        fi
        rm -rf target/demo-results/*
        cp -R "$$latest"/. target/demo-results/
        echo "Demo results:"
        ls -la target/demo-results

volumes:
  taskflow-minio-data:
