name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: push-evidence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  push-fast:
    name: Push-fast
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compile production and test sources
        run: >
          bash ./mvnw --batch-mode --no-transfer-progress
          -DskipTests
          test-compile

      - name: Run unit and component tests
        run: >
          bash ./mvnw --batch-mode --no-transfer-progress
          -Dtest='!*IntegrationTest,!*LiveTest,!DatabaseManagerTest,!SqlitePersistenceContractTest,!MinioObjectStoreContractTest,!RabbitMqBrokerContractTest,!CrashWindowMatrixTest,!TaskFlowModelPropertyTest,!*ArchitectureTest,!*Experiment'
          -Dsurefire.failIfNoSpecifiedTests=false
          test
        env:
          TASKFLOW_RABBITMQ_LIVE_TEST: "false"

      - name: Run architecture tests
        run: >
          bash ./mvnw --batch-mode --no-transfer-progress
          -Dtest=ObjectStoreArchitectureTest,SchedulerArchitectureTest,RabbitMqOnlyRuntimeArchitectureTest
          -Dsurefire.failIfNoSpecifiedTests=false
          test

      - name: Run bounded scheduler model seed set
        run: >
          bash ./mvnw --batch-mode --no-transfer-progress
          -pl taskflow-coordinator
          -am
          -Dtest=TaskFlowModelPropertyTest
          -Dsurefire.failIfNoSpecifiedTests=false
          test

      - name: Check whitespace
        run: git diff-tree --check --no-commit-id --root -r HEAD

      - name: Retain push-fast failure reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: push-fast-${{ github.run_id }}-${{ github.run_attempt }}
          path: "**/target/surefire-reports/**"
          if-no-files-found: ignore
          retention-days: 14

  push-integration:
    name: Push-integration
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      rabbitmq:
        image: rabbitmq:3.13-management
        ports:
          - 5672:5672
          - 15672:15672
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_port_listener 5672"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run SQLite, MinIO, RabbitMQ, and participant contracts
        run: >
          bash ./mvnw --batch-mode --no-transfer-progress
          -pl taskflow-persistence-sqlite,taskflow-objectstore-minio,taskflow-transport-rabbitmq,taskflow-coordinator,taskflow-peer,taskflow-gui
          -am
          -Dtaskflow.rabbitmq.live=true
          -Dtest='*IntegrationTest,*LiveTest,DatabaseManagerTest,SqlitePersistenceContractTest,MinioObjectStoreContractTest,RabbitMqBrokerContractTest,PeerNodeTest,RabbitMqJobSubmissionClientTest,RabbitMqCoordinatorConnectionTest,!RabbitMqBrokerRecoveryIntegrationTest'
          -Dsurefire.failIfNoSpecifiedTests=false
          test
        env:
          TASKFLOW_RABBITMQ_HOST: localhost
          TASKFLOW_RABBITMQ_PORT: "5672"
          TASKFLOW_RABBITMQ_USERNAME: guest
          TASKFLOW_RABBITMQ_PASSWORD: guest
          TASKFLOW_RABBITMQ_MANAGEMENT_URL: http://localhost:15672
          TASKFLOW_RABBITMQ_MANAGEMENT_USERNAME: guest
          TASKFLOW_RABBITMQ_MANAGEMENT_PASSWORD: guest
          TASKFLOW_RABBITMQ_LIVE_TEST: "true"

      - name: Retain push-integration reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: push-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: "**/target/surefire-reports/**"
          if-no-files-found: error
          retention-days: 14
